<div class="p-2"><div class="row text-center mb-2"><div class="col"><strong>{{ counts.critical }}</strong><div class="small">Critical</div></div><div class="col"><strong>{{ counts.warning }}</strong><div class="small">Warning</div></div><div class="col"><strong>{{ counts.expired }}</strong><div class="small">Expired</div></div></div>{% for cert,state in upcoming %}<div><a href="{{ cert.get_absolute_url }}">{{ cert }}</a> <span class="badge text-bg-warning">{{ state.days }}d</span></div>{% empty %}<div class="text-muted">No upcoming expirations.</div>{% endfor %}</div>
