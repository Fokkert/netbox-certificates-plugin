<div class="d-flex flex-wrap align-items-center gap-2 mb-3" data-selection-controls>
  <button type="button" class="btn btn-sm btn-outline-secondary" data-select-all disabled>{{ select_label|default:"Select all on this page" }}</button>
  <button type="button" class="btn btn-sm btn-outline-secondary" data-select-none disabled>Clear selection</button>
  <span class="text-muted small" data-selection-count aria-live="polite"></span>
</div>
